name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── AC1: typecheck（vue-tsc）+ build ──────────────────────────────────
  typecheck-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout haven-console
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck (vue-tsc)
        run: pnpm typecheck

      - name: Build + 生成 .gz（构建期预生成，供 nginx gzip_static）
        run: pnpm build:gz

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── AC1: vitest ──────────────────────────────────────────────────────
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout haven-console
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # 失败自动上报：vitest log 尾部进 STEP_SUMMARY（check-runs API 匿名可读），
      # junit 解析成 ::error annotation（逐测试定位），报告作为 artifact 留存。
      - name: Vitest
        shell: bash
        run: |
          set -o pipefail
          pnpm test -- --reporter=default --reporter=junit --outputFile.junit=vitest-junit.xml 2>&1 | tee vitest.log
          exit_code=${PIPESTATUS[0]}
          {
            echo '## Vitest 输出尾部（120 行）'
            echo '```'
            tail -n 120 vitest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $exit_code -ne 0 ]; then
            node scripts/report-vitest-failures.mjs vitest-junit.xml
          fi
          exit $exit_code

      - name: Upload vitest report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: |
            vitest-junit.xml
            vitest.log
          retention-days: 7

  # ── lint：0 error / 0 warning 基线（2026-02 接入）───────────────────────
  # `pnpm lint` = 纯检查（修复用 lint:fix）。首接基线 0E/18W 已全部清零；
  # '_'-前缀参数/变量为约定占位豁免（eslint.config.js）。
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout haven-console
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

  # ── AC2: gzip 预算闸门（≤ 300KB，四桶分解）────────────────────────────
  # 依赖 typecheck-build 产物（dist/**/*.gz）
  gzip-budget:
    name: Gzip Budget (≤300KB)
    needs: typecheck-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout haven-console
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Gzip 预算检查（Hard Rule：超限必须 fail）
        run: node scripts/gzip-budget.mjs dist

  # ── AC3/AC4: 拷贝面漂移对比（双向：e-cam-web 源 sha256 + 本仓拷贝 sha256 vs shared-hashes.json）──
  # Hard Rule：源漂移只能以 e-cam-web 对应 commit 源文件为准；本仓漂移以本仓拷贝为准。
  drift-compare:
    name: Drift Compare (e-cam-web sha256)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout haven-console
        uses: actions/checkout@v4

      - name: Checkout e-cam-web（漂移比对源仓）
        uses: actions/checkout@v4
        with:
          repository: Havens-blog/e-cam-web
          ref: main
          path: e-cam-web

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 漂移比对（e-cam-web 源文件重算 sha256 vs shared-hashes.json）
        env:
          # drift-check.mjs 默认取 ../e-cam-web；CI 下把源仓 checkout 到 ./e-cam-web
          E_CAM_WEB_ROOT: ${{ github.workspace }}/e-cam-web
        run: node scripts/drift-check.mjs shared-hashes.json "$E_CAM_WEB_ROOT"
